name: Audit 27 instruments on Binance and Gate

on:
  push:
    branches:
      - feature/gate-27-universe-audit
    paths:
      - scripts/audit_27_exchange_symbols.py
      - .github/workflows/audit-27-exchange-symbols.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-27-exchange-symbols
  cancel-in-progress: false

jobs:
  compare-contract-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Compare live official contract lists
        run: python scripts/audit_27_exchange_symbols.py
      - name: Upload exact-name comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-27-exchange-symbol-audit
          path: results/gate-27-universe-audit/
          if-no-files-found: warn
          retention-days: 30
