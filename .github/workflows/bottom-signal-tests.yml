name: Bottom signal module tests
on:
  push:
    branches: [bottom-signal-refactor]
    paths:
      - "bottom-signal/**"
      - "tests/test_signal_feed.mjs"
      - "tests/test_static_preview.mjs"
      - "index.html"
      - ".github/workflows/bottom-signal-tests.yml"
  pull_request:
    paths:
      - "bottom-signal/**"
      - "tests/test_signal_feed.mjs"
      - "tests/test_static_preview.mjs"
      - "index.html"
      - ".github/workflows/bottom-signal-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate feed contract and static preview
        run: node --test tests/test_signal_feed.mjs tests/test_static_preview.mjs
