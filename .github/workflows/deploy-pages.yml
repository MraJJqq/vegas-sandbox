name: Deploy signal display preview
on:
  push:
    branches: [signal-display-preview]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: signal-display-preview-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate preview
        run: |
          test -s index.html
          grep -q 'display:flex' index.html
          grep -q 'justify-content:flex-end' index.html
          grep -q 'signal-separator' index.html
          grep -q 'background:transparent' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
