name: V12-V4 Reliability Audit (Sandbox Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-v12-v4-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout V12 main (read-only source)
        uses: actions/checkout@v4
        with:
          repository: MraJJqq/v12
          ref: main
          path: source/v12-main
      - name: Checkout V12 EMA alignment PR #8 (read-only source)
        uses: actions/checkout@v4
        with:
          repository: MraJJqq/v12
          ref: refs/pull/8/head
          path: source/v12-ema-pr
      - name: Checkout V4 main (read-only source)
        uses: actions/checkout@v4
        with:
          repository: MraJJqq/vegas-octopus-v4
          ref: main
          path: source/v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/v12-main/requirements.txt
      - name: Install V12 test dependencies
        run: python -m pip install -r source/v12-main/requirements.txt
      - name: Compile and test V12 main
        working-directory: source/v12-main
        run: python -m compileall -q v12 signal_rules.py tests && python -m unittest discover -s tests -v
      - name: Compile and test V12 EMA PR #8
        working-directory: source/v12-ema-pr
        run: python -m compileall -q v12 signal_rules.py tests && python -m unittest discover -s tests -v
      - name: Syntax-check and test V4
        working-directory: source/v4
        run: |
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test scripts/v4-*.test.mjs
      - name: Run cross-repository static contract audit
        run: python scripts/audit_v12_v4.py source
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-v4-reliability-audit
          path: docs/V12_V4_RELIABILITY_AUDIT.md
          retention-days: 30
