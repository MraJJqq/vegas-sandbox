<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signals</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{min-height:100vh;min-height:100dvh;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#signals{position:static;flex:0 1 auto;max-width:100%;display:block;overflow-x:auto;overflow-y:hidden;white-space:nowrap;text-align:right;scrollbar-width:none;color:#fff;font-size:16px;font-weight:400;line-height:1.4;text-shadow:0 1px 3px #000}
#signals::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="signals" aria-live="polite"></div>
<script>
(() => {
  "use strict";
  const FEED_URL = "https://raw.githubusercontent.com/MraJJqq/Vegasbark/main/public/signals.json";
  const container = document.getElementById("signals");
  const demoSymbols = ["BTC","ETH","SOL","XRP","DOGE","BNB"];

  function render(symbols) {
    const display = symbols
      .map(value => String(value).trim().toUpperCase().replace(/USDT$/, ""))
      .filter(value => /^[A-Z0-9]{2,16}$/.test(value));
    container.textContent = display.join(" ▰\u00A0");
  }

  render(demoSymbols);

  async function refresh() {
    try {
      const response = await fetch(FEED_URL + "?_=" + Date.now(), {cache:"no-store"});
      if (!response.ok) return;
      const payload = await response.json();
      if (!payload || payload.schema_version !== 1 || payload.source !== "Vegasbark" || !Array.isArray(payload.symbols)) return;
      const symbols = [...new Set(payload.symbols)];
      if (symbols.length) render(symbols);
    } catch (_) {}
  }
  refresh();
  window.setInterval(refresh,15000);
})();
</script>
</body>
</html>
