<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signals</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent;color:#fff;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
#signals{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:7px;max-width:min(560px,calc(100vw - 32px))}
.signal{display:inline-flex;align-items:center;gap:5px;color:#fff;font-size:13px;font-weight:700;white-space:nowrap;text-shadow:0 1px 4px #000;animation:appear .25s ease both}
.signal:before{content:"▸";font-size:12px}
@keyframes appear{from{opacity:0}to{opacity:1}}
@media(max-width:520px){#signals{right:10px;bottom:10px;max-width:calc(100vw - 20px);gap:5px}.signal{font-size:12px}}
</style>
</head>
<body>
<div id="signals" aria-live="polite"></div>
<script>
(() => {
  "use strict";
  const FEED_URL = "https://raw.githubusercontent.com/MraJJqq/Vegasbark/main/public/signals.json";
  const container = document.getElementById("signals");

  async function refresh() {
    try {
      const response = await fetch(FEED_URL + "?_=" + Date.now(), {cache:"no-store"});
      if (!response.ok) return;
      const payload = await response.json();
      if (!payload || payload.schema_version !== 1 || payload.source !== "Vegasbark" || !Array.isArray(payload.symbols)) return;
      const symbols = [...new Set(payload.symbols.map(value => String(value).trim().toUpperCase()).filter(value => /^[A-Z0-9]{2,20}$/.test(value)))];
      const fragment = document.createDocumentFragment();
      symbols.forEach((symbol,index) => {
        const item = document.createElement("span");
        item.className = "signal";
        item.textContent = symbol;
        item.style.animationDelay = Math.min(index * 30,300) + "ms";
        fragment.appendChild(item);
      });
      container.replaceChildren(fragment);
    } catch (_) {}
  }

  refresh();
  window.setInterval(refresh,15000);
})();
</script>
</body>
</html>
