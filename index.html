<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vegas Signal Display Preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:#080d18;
}
#signals{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  align-items:center;
  max-width:100%;
  color:#fff;
  background:transparent;
  border:0;
  box-shadow:none;
  text-align:right;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  font-size:15px;
  font-weight:600;
  line-height:1.4;
  white-space:normal;
}
.signal-symbol{white-space:nowrap}
.signal-separator{white-space:pre}
</style>
</head>
<body>
<div id="signals" aria-label="Vegas signals"></div>
<script>
(() => {
  const symbols = ["NVDA", "MSFT", "AMZN", "BTC", "ETH"];
  const bold = Object.fromEntries(
    [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"].map((c, i) =>
      [c, [..."𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙𝟎𝟏𝟐𝟑𝟒𝟓𝟔𝟕𝟖𝟗"][i]]
    )
  );
  const root = document.getElementById("signals");
  symbols.forEach((symbol, index) => {
    if (index) {
      const separator = document.createElement("span");
      separator.className = "signal-separator";
      separator.textContent = "\u00a0▰\u00a0";
      root.append(separator);
    }
    const item = document.createElement("span");
    item.className = "signal-symbol";
    item.textContent = [...symbol].map(c => bold[c] || c).join("");
    root.append(item);
  });
})();
</script>
</body>
</html>
