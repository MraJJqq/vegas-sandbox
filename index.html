<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signals</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent;color:#fff;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#signals{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px 16px;width:100%;padding:0}
.signal{display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:14px;font-weight:700;line-height:1.5;white-space:nowrap;text-shadow:0 1px 3px #000}
.signal:before{content:"▸";font-size:13px}
@media(max-width:520px){#signals{gap:6px 12px}.signal{font-size:13px}}
</style>
</head>
<body>
<div id="signals" aria-live="polite"></div>
<script>
(() => {
  "use strict";
  const FEED_URL = "https://raw.githubusercontent.com/MraJJqq/Vegasbark/main/public/signals.json";
  const container = document.getElementById("signals");

  async function refresh() {
    try {
      const response = await fetch(FEED_URL + "?_=" + Date.now(), {cache:"no-store"});
      if (!response.ok) return;
      const payload = await response.json();
      if (!payload || payload.schema_version !== 1 || payload.source !== "Vegasbark" || !Array.isArray(payload.symbols)) return;
      const symbols = [...new Set(payload.symbols.map(value => String(value).trim().toUpperCase()).filter(value => /^[A-Z0-9]{2,20}$/.test(value)))];
      const fragment = document.createDocumentFragment();
      symbols.forEach(symbol => {
        const item = document.createElement("span");
        item.className = "signal";
        item.textContent = symbol;
        fragment.appendChild(item);
      });
      container.replaceChildren(fragment);
    } catch (_) {}
  }

  refresh();
  window.setInterval(refresh,15000);
})();
</script>
</body>
</html>
