<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vegas Signal</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent;color:#fff;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
.signal-panel{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));max-width:calc(100vw - 32px);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.title{font-size:13px;font-weight:700;letter-spacing:.08em;white-space:nowrap;text-shadow:0 1px 4px #000}
.content{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:min(560px,calc(100vw - 32px))}
.symbol{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 4px #000;animation:appear .25s ease both}
@keyframes appear{from{opacity:0}to{opacity:1}}
@media(max-width:520px){.signal-panel{right:10px;bottom:10px}.content{max-width:calc(100vw - 20px);gap:5px}.symbol{font-size:12px}}
</style>
</head>
<body>
<section class="signal-panel" aria-label="Vegas signals">
  <div class="title">▸▸ VEGAS SIGNAL ◂◂</div>
  <div class="content" id="signals" aria-live="polite"></div>
</section>
<script>
(() => {
  "use strict";
  const FEED_URL = "https://raw.githubusercontent.com/MraJJqq/Vegasbark/main/public/signals.json";
  const signals = document.getElementById("signals");

  async function refresh() {
    try {
      const response = await fetch(FEED_URL + "?_=" + Date.now(), {cache:"no-store"});
      if (!response.ok) return;
      const payload = await response.json();
      if (!payload || payload.schema_version !== 1 || payload.source !== "Vegasbark" || !Array.isArray(payload.symbols)) return;
      const symbols = [...new Set(payload.symbols.map(value => String(value).trim().toUpperCase()).filter(value => /^[A-Z0-9]{2,20}$/.test(value)))];
      const fragment = document.createDocumentFragment();
      symbols.forEach((symbol,index) => {
        const item = document.createElement("span");
        item.className = "symbol";
        item.textContent = symbol;
        item.style.animationDelay = Math.min(index * 30,300) + "ms";
        fragment.appendChild(item);
      });
      signals.replaceChildren(fragment);
    } catch (_) {}
  }

  refresh();
  window.setInterval(refresh,15000);
})();
</script>
</body>
</html>
